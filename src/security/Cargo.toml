[package]
name = "dracon-security"
# 0.4.0 (2026-09-27, D3): BREAKING — removed the unreachable public APIs
# `WardenSecurity::decrypt_path` (with the private `decrypt_file` it
# solely called) and `TeamManager::revoke_recipient`, plus the doc line
# that advertised recipient revocation. For a 0.x crate the MINOR is the
# breaking axis, so the removal moves 0.3 -> 0.4 (not a patch).
version = "0.4.0"
edition = "2021"
# See dracon-sync/Cargo.toml — workspace-wide MSRV, audit F84.
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Secret scanning and age-based encryption primitives used by Dracon tooling"
repository = "https://github.com/DraconDev/dracon-utilities"
homepage = "https://github.com/DraconDev/dracon-utilities"
documentation = "https://docs.rs/dracon-security"

[dependencies]
log = "0.4"
walkdir = "2.5"
age = "0.10"
aes-gcm = "0.10"
anyhow = "1.0"
rand = "0.8"
regex = "1.10"
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
zeroize = { version = "1.7", features = ["derive"] }
dirs = "6.0"
globset = "0.4"
once_cell = "1.19"
sha2 = "0.10"
bech32 = "0.11.1"
curve25519-dalek = "4.1"
ed25519-dalek = { version = "2.1.1", features = ["hazmat"] }
uuid = { version = "1.0", features = ["v4"] }
serde_json = "1.0"
base64 = "0.22.1"
rayon = "1.10"
x25519-dalek = "2.0"


[dev-dependencies]
age = "0.10"
aes = "0.8"
cfb-mode = "0.8"
proptest = "1.9.0"
tempfile = "3.8"

