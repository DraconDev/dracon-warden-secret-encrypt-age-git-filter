# Dracon Warden Policy
# Path: ~/.dracon/utilities/warden/dracon-warden.toml
#
# Controls secret encryption and repo discovery roots.
#
# Quick start:
#   1. Install: ./install.sh at the dracon-utilities monorepo root
#      (installs binary + hooks automatically; there is no per-utility installer)
#   2. Or manually: dracon-warden setup-hooks --global
#   3. Harden a repo: dracon-warden once <repo>
#
# The setup-hooks command installs git hooks (pre-commit + pre-push) globally
# that enforce encryption. The pre-commit hook blocks commits if the filter
# is not configured. The pre-push hook scans for plaintext secrets.

# Directories to scan for git repos when running `once`, `repair`, or
# `setup-hooks`. These are NOT filesystem watchers (warden has no daemon
# mode); they are the search roots for the recursive git-repo discovery.
# Paths that do not exist on disk are silently filtered out. Discovery walks
# recursively, including nested checkouts and .git pointer-file repositories,
# but skips .git metadata directories and symlinked .git markers.
repo_roots = ["~/.dracon", "~/Dev"]

# Directories to scan during discovery (once/repair commands) in addition
# to repo_roots. Use this only if you want a DIFFERENT set of paths for
# discovery (e.g. wider search) than the canonical repo_roots list.
# If omitted, repo_roots are used for discovery as well.
# discover_roots = ["~/extra-search-root"]

# --- Deprecated ---
# The `watch_roots` key is still accepted for backwards compatibility but
# logs a deprecation warning to stderr and a yellow ⚠ row in
# `dracon-warden status`. Rename to `repo_roots` to silence it. This alias
# will be removed in a future release.

# Glob patterns for files that MUST be encrypted (age filter + gitattributes)
# These files are tracked in git but stored as encrypted blobs.
# Example: ["*.key", "*.pem", "*.env", ".ssh/*", "secrets/*"]
#
# ADDED 2026-09-30 — shipped LLM-conversation defaults: as soon as this list
# is non-empty, the warden additionally protects `conversation-*` and
# `pi-session-*` (Muse / Pi session exports), `trajectory-*` (`muse export`
# RAW transcripts) and transcript-only `rollout-*` (Codex session copies),
# each in their dump extensions — all carry pasted secrets and PII in free
# prose. They are persisted but whole-file age-encrypted in git, at any
# depth. An empty list keeps the legacy scan-everything behavior (which
# already covers dumps via the filename rule). Per-file opt-out: touch
# `<file>.plaintext`. Note: dumps can be tens of MB (57 MB observed), so a
# default 10 MiB `filter_max_bytes` install fails closed on the largest
# ones — raise the limit (64 MiB ceiling) rather than disabling the filter.
protected_patterns = []

# Glob patterns for files that must remain plaintext (excluded from encryption)
# Use for files that need to be readable without decryption keys.
# Must use the validator allowlist (build artifacts, binaries, *.pub keys,
# Cargo.lock, events jsonl) — e.g. ["Cargo.lock", "*.pub"].
plaintext_patterns = []

# ADDED 2026-09-27 (audit decision D2) — binary carve-out.
#
# The eager-source-encryption catch-all (`* filter=dracon`) routes EVERY
# file through the filter, and the filter refuses to clean anything over
# `filter_max_bytes` rather than commit it unencrypted. Combined, that
# meant a single 20 MiB screenshot made `git add` fail outright, with a
# message claiming the file "would be committed UNENCRYPTED" — for a file
# that was never a secret. The obvious "fix" for an operator is to turn
# the filter off, which would strip the protection from everything.
#
# These patterns are emitted as `-filter` carve-outs in the managed
# .gitattributes block, and the oversize refusal honours the same list in
# the `filter-process` driver, so binary media and archives are committed
# as-is no matter their size. They carry no greppable secret material and
# are not reviewable in a diff, so filtering them buys nothing.
#
# Omit this key to use the shipped defaults (images, video/audio,
# archives, compiled artefacts, pdf). Set it to an explicit list to
# REPLACE the defaults, or `[]` to disable the carve-out entirely and
# restore the hard failure for every oversized file.
#
# SIZE CEILING: git's long-running filter protocol has no flow control, so
# the driver must hold an oversize blob until the request ends before it
# can answer (streaming it back deadlocks both pipes). That buffer is
# bounded at 4x filter_max_bytes — raise filter_max_bytes to raise it with
# it. A blob past the ceiling is refused with an explicit message rather
# than relayed truncated, so .gitignore anything that legitimately exceeds
# it. The ceiling applies to smudge too: an over-ceiling blob fails
# checkout/diff of that file under the installed filter-process driver
# (e.g. the limit was lowered after push, or the blob came from a
# higher-limit machine). Recover one file at a time with the one-shot
# path, which streams without a ceiling:
#   git show HEAD:<path> | dracon-warden filter-smudge <path> > <path>
#
# ENTRY POINTS: the in-filter exemption needs the pathname, which git
# supplies over `filter.dracon.process` (what `dracon-warden once`
# installs) and which `dracon-warden filter-clean <path>` accepts as an
# argument. A repo still configured with the older one-shot
# filter.dracon.clean/smudge pair gets NO pathname (verified on git
# 2.51.2), so there the guard stays closed: the `-filter` lines in the
# managed block are the mechanism there, so run `dracon-warden once` to
# migrate the repo.
#
# SECURITY NOTE: a file under one of these patterns is never scanned, so a
# secret placed in e.g. `notes.png` is NOT detected. Keep genuinely
# sensitive directories under `protected_patterns` instead — protected
# patterns are applied AFTER these carve-outs, so they still win in
# .gitattributes, and the filter itself refuses to let an oversize file
# through a protected path: an oversize `secrets/big.png` fails closed
# rather than passing through unencrypted and unscanned.
#
# Left commented out on purpose: the key is an Option, so omitting it uses
# the shipped defaults. An explicit `[]` here would DISABLE the carve-out
# and bring back the hard failure this key exists to remove.
# binary_filter_exempt_patterns = ["*.png", "*.jpg", "*.mp4", "*.zip"]

# Glob patterns for binary MEDIA selected for whole-file encryption
# (screenshots of internal systems, customer data on screen, ...).
# OFF BY DEFAULT: omitted or `[]` disables the option entirely — no
# shipped defaults, no behavior change, game art and ordinary
# screenshots stay visible and renderable. Unlike `protected_patterns`,
# this list never changes the scan-everything/scan-allowlist posture;
# it only routes its own matches through the filter (binaries
# whole-file encrypt; an oversize media file fails closed rather than
# passing through unencrypted). Entries win over the binary carve-outs
# above; an exact plaintext_patterns overlap is rejected as a
# contradiction. Hygiene-ignored paths stay ignored.
# media_protected_patterns = ["internal-dashboards/**"]

# Glob patterns for hygiene checks (files that should NOT exist in repo).
# These are the shipped defaults: Pi harness state, browser trace logs, and
# regeneratable frontend build caches stay machine-local. Set an explicit list
# to extend or replace them for a particular installation.
hygiene_patterns = [
    "**/.pi*",
    # 2026-09-30 audit: aider working memory (`.aider.chat.history.md`,
    # `.aider.input.history`) — aider's own docs recommend ignoring it.
    "**/.aider*",
    # Product-default machine-local audit/cache hygiene (2026-08-30).
    # These artifacts are regeneratable and must not rebloat repositories.
    "web/games/audit-evidence/",
    "**/audit-evidence/",
    "**/.pi-glla/",
    "**/.bucket-cache/",
    "web/games/wip/football-forever/docs/audit/",
    "web/games/wip/football-forever/audit-evidence/",
    "**/chrometrace.log",
    "**/.svelte-kit/",
    "**/.vite/",
    "**/.turbo/",
    "**/.cache/",
]
